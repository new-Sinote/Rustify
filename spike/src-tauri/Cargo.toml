[package]
name = "rustify-spike"
version = "0.1.0"
description = "Rustify Phase 3 Windows DRM/background-playback spike"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
url = "2.5.9"
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
